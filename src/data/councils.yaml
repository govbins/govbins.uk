# Every council govbins knows about, past, present and scheduled.
#
# id:          used in the URL (govbins.uk/<id>). Don't change once published.
# type:        county | district | unitary | metropolitan-district |
#              london-borough | city-of-london. Counties don't collect bins.
# gss:         ONS code, used to draw the map
# county:      for two-tier districts, the county council's id
# start / end: dates the council existed (end is the last day)
# successors:  ids of the council(s) that took over
#
# To add a reorganisation: add the new councils with a start date, and give
# each old council an end date (the day before vesting day) and successors.
# The site works out what's current when it's built.

